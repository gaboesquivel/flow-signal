# Delete a PR's Neon preview branch when the PR closes (merged or not).
# The Vercel-managed Neon integration only deletes preview branches when Vercel's retention
# removes the deployment (30 days on Hobby), and the Free plan caps a project at 10 branches.
# Needs repo variable NEON_PROJECT_ID and secret NEON_API_KEY (project-scoped key); docs/database.md.
name: Neon preview cleanup

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  delete-preview-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        # A PR whose preview never built has no branch to delete.
        continue-on-error: true
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
