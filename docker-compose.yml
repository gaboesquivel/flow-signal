# Local test database: Postgres 18 + pgvector behind a Neon HTTP/WebSocket proxy, so tests use
# the same @neondatabase/serverless driver as production. `pnpm db:up` / `pnpm db:down`.
# Connect with postgres://postgres:postgres@db.localtest.me:5432/<database> (see lib/signal/README.md).
name: signal

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@db:5432/postgres
    ports:
      - "4444:4444"
    depends_on:
      db:
        condition: service_healthy
